name: build
on: push

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BADAHE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk badahe.apk
      - uses: actions/upload-artifact@v4
        with: { name: badahe-apk, path: badahe.apk }
      - name: Release (default branch only)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ github.run_number }}" badahe.apk --target "$GITHUB_SHA" --title "v${{ github.run_number }}" --notes "نسخه‌ی ${{ github.run_number }}"

  # Runs the real APK on an emulator. Separate job: a failure here never blocks the APK/release above.
  e2e:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: badahe-apk }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: node test/e2e.js badahe.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-shots, path: shots, if-no-files-found: ignore }
